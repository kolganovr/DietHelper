{% extends "diet/layout.html" %}

{% block body %}
    <h1>Welcome to Diet Helper Settings</h1>
    <a href="{% url 'home' %}">Home</a>

    {% if user.is_authenticated %}
        <form action="{% url 'settings' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="diet_description">Diet Description</label>
                <textarea class="form-control" id="diet_description" name="diet_description" rows="3" placeholder="Enter your diet description here">{{ user_diet_info }}</textarea>
                <label for="api_key">API Key</label>
                <input type="text" class="form-control" id="api_key" name="api_key" placeholder="Enter your API key here" value="{{ user.apiKey }}">
            </div>
            <button class="btn btn-primary" type="submit">Save Changes</button>
        </form>
    {% else %}
        <p>You need to be logged in to edit your settings.</p>
    {% endif %}
{% endblock %}
