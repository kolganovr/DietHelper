{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Diet Helper</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        
        <script src="{% static 'diet/bundle.js' %}" defer></script>

        <link href="{% static 'diet/styles.css' %}" rel="stylesheet">
    </head>
    <body>
        <div class="app-bar">
            {% block appbar-left-icon %}
            
            {% endblock %}

            {% block title %}{% endblock %}

            {% if user.is_authenticated %}
                <md-icon-button href="{% url 'profile' %}">
                    <span class="user-initial">{{ user.username|slice:":1" }}</span>
                </md-icon-button>
            {% else %}
                <md-icon-button href="{% url 'profile' %}">
                    <md-icon>account_circle</md-icon>
                </md-icon-button>
            {% endif %}
        </div>
        {% block body %}
        {% endblock %}
        <script>
            const productCheckDiv = document.getElementById('product-check');
            const productInput = document.getElementById('product-input');

            if (productCheckDiv && productInput) {
                const initialHeight = window.innerHeight;

                const adjustPosition = () => {
                    if (document.activeElement === productInput) {
                        const innerHeight = window.innerHeight;
                        const visualHeight = window.visualViewport ? window.visualViewport.height : innerHeight;
                        
                        // Если innerHeight не изменился (iOS), а visualHeight уменьшился
                        const iosKeyboardHeight = innerHeight - visualHeight;
                        
                        if (iosKeyboardHeight > 50) {
                            // Это iOS, клавиатура открыта
                            productCheckDiv.style.bottom = `${iosKeyboardHeight}px`;
                        } else {
                            // На Android (где bottom: 0 сам поднимается) или на ПК
                            productCheckDiv.style.bottom = '0';
                        }
                    } else {
                        productCheckDiv.style.position = 'fixed';
                        productCheckDiv.style.bottom = '0';
                    }
                };

                productInput.addEventListener('focus', () => setTimeout(adjustPosition, 100));
                productInput.addEventListener('blur', () => {
                    productCheckDiv.style.position = 'fixed';
                    productCheckDiv.style.bottom = '0';
                });

                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', adjustPosition);
                }
                window.addEventListener('resize', adjustPosition);
            }
        </script>
    </body>
</html>
